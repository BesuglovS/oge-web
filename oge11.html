      // Перемешиваем массив задач (алгоритм Фишера-Йетса)
      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      let shuffledTasks = [];
      let currentTaskIndex = 0;
      let currentTask = null;
      let answeredTasks = new Set();

      // Решённые задачи переживают перезагрузку: храним id задач
      // (индексы после перемешивания нестабильны).
      const SOLVED_KEY = 'oge11-solved';
      function loadSolvedIds() {
        try {
          const raw = localStorage.getItem(SOLVED_KEY);
          const ids = raw ? JSON.parse(raw) : [];
          return Array.isArray(ids) ? ids : [];
        } catch (e) { return []; }
      }
      function saveSolvedIds(ids) {
        try { localStorage.setItem(SOLVED_KEY, JSON.stringify(ids)); } catch (e) { /* storage */ }
      }
      function rememberSolved(taskId) {
        const ids = loadSolvedIds();
        if (ids.indexOf(taskId) === -1) {
          ids.push(taskId);
          saveSolvedIds(ids);
        }
      }

      function getRandomUnansweredIndex() {
        const unanswered = [];
        for (let i = 0; i < shuffledTasks.length; i++) {
          if (!answeredTasks.has(i)) {
            unanswered.push(i);
          }
        }
        // Не повторяем текущую задачу, пока есть другие неотвеченные
        let pool = unanswered.filter(function (i) { return i !== currentTaskIndex; });
        if (pool.length > 0) {
          return pool[Math.floor(Math.random() * pool.length)];
        }
        // Все задачи отвечены — берём случайную, отличную от текущей
        const all = [];
        for (let i = 0; i < shuffledTasks.length; i++) {
          if (i !== currentTaskIndex) all.push(i);
        }
        if (all.length === 0) return 0;
        return all[Math.floor(Math.random() * all.length)];
      }

      function updateSolvedCounter() {
        const el = document.getElementById("solvedNumber");
        if (el) el.textContent = answeredTasks.size;
      }

      // Приводим ответ к единому виду: регистр, «ё»→«е», пробелы и обрамляющие знаки
      function normalizeAnswer(value) {
        return (value || "")
          .toLowerCase()
          .replace(/ё/g, "е")
          .replace(/\s+/g, " ")
          .replace(/^[\s.,;:!?"'«»()\u2014-]+/, "")
          .replace(/[\s.,;:!?"'«»()\u2014-]+$/, "");
      }

      function renderTask(index) {
        const task = shuffledTasks[index];
        currentTask = task;
        currentTaskIndex = index;

        document.getElementById("taskType").textContent = "Задача №" + task.id;
        document.getElementById("taskText").innerHTML = task.text;
        updateSolvedCounter();

        const input = document.getElementById("answerInput");
        input.value = "";
        input.className = "answer-input";
        input.disabled = false;

        document.getElementById("result").className = "result";
        document.getElementById("result").innerHTML = "";

        hideHintsAndSolution();

        // Если задача уже отвечена, показываем результат
        if (answeredTasks.has(index)) {
          input.value = task.answer;
          input.className = "answer-input correct";
          input.disabled = true;
          const result = document.getElementById("result");
          result.className = "result correct";
          result.innerHTML = "✅ Правильно!";
        }
      }

      function checkAnswer() {
        const input = document.getElementById("answerInput");
        const result = document.getElementById("result");
        const userAnswer = normalizeAnswer(input.value);
        const correctAnswer = normalizeAnswer(currentTask.answer);

        if (!userAnswer) {
          input.focus();
          return;
        }

        if (userAnswer === correctAnswer) {
          input.className = "answer-input correct";
          input.disabled = true;
          result.className = "result correct";
          result.innerHTML = "✅ Правильно! Отличная работа!";
          answeredTasks.add(currentTaskIndex);
          rememberSolved(currentTask.id);
          updateSolvedCounter();
          if (typeof OGEProgress !== 'undefined') {
            OGEProgress.save('oge11', 1, 1);
            OGEProgress.renderProgressBar('progressContainer');
          }
          if (typeof trackTaskComplete === 'function') { trackTaskComplete('oge11', 1); }
        } else {
          input.className = "answer-input incorrect";
          result.className = "result incorrect";
          result.innerHTML =
            "❌ Неправильно. Правильный ответ: <strong>" +
            currentTask.answer +
            "</strong>";
        }
      }

      function nextTask() {
        renderTask(getRandomUnansweredIndex());
        const input = document.getElementById("answerInput");
        if (!input.disabled) input.focus();
      }

      function showHint() {
    if (typeof trackHint === 'function') { trackHint('oge11'); }
        const hintBox = document.getElementById("hintBox");
        const hintText = document.getElementById("hintText");
        hintText.innerHTML = currentTask.hint;
        hintBox.style.display = "block";
        document.getElementById("solutionBox").style.display = "none";
      }

      function showSolution() {
    if (typeof trackSolution === 'function') { trackSolution('oge11'); }
        const solutionBox = document.getElementById("solutionBox");
        const solutionSteps = document.getElementById("solutionSteps");
        solutionSteps.innerHTML = currentTask.solution;
        solutionBox.style.display = "block";
        document.getElementById("hintBox").style.display = "none";
      }

      function hideHintsAndSolution() {
        document.getElementById("hintBox").style.display = "none";
        document.getElementById("solutionBox").style.display = "none";
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Добавляем обработчик Enter
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("answerInput")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              checkAnswer();
            }
          });
      });

      // Инициализация: перемешиваем задачи и показываем первую случайную
      shuffledTasks = shuffleArray([...tasks]);
      // Восстанавливаем решённые задачи (по id, а не по индексам).
      const savedSolved = loadSolvedIds();
      answeredTasks = new Set();
      for (let si = 0; si < shuffledTasks.length; si++) {
        if (savedSolved.indexOf(shuffledTasks[si].id) !== -1) answeredTasks.add(si);
      }
      if (typeof trackTaskStart === 'function') { trackTaskStart('oge11'); }
      renderTask(getRandomUnansweredIndex());
      if (typeof OGEProgress !== 'undefined') { OGEProgress.renderProgressBar('progressContainer'); }
    </script>

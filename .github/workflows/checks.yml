name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP lint
        run: php -l run_python.php && php -l git/index.php

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static site checks
        run: node tools/check-site.mjs

      - name: Data checks (tasks 7, 12, 15, 16)
        run: node tools/check-data.mjs

      - name: Sandbox integration test
        run: node tools/check-sandbox.mjs

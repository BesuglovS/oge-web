name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP lint
        run: php -l run_python.php && php -l git/index.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static site checks
        run: node tools/check-site.mjs

      - name: CSS audit
        run: node tools/check-css.mjs

      - name: Data checks (tasks 1-10, 12, 15, 16)
        run: node tools/check-data.mjs

      - name: Theory code examples
        run: node tools/check-theory.mjs

      - name: Task 11 answers vs archive
        run: node tools/check-oge11-archive.mjs

      - name: Sandbox integration test
        run: node tools/check-sandbox.mjs

      # Браузерный smoke-тест: реальный Chrome, реальные страницы.
      # Сервер поднимаем в том же шаге — GitHub гасит фоновые процессы
      # при завершении шага.
      - name: Browser smoke test (headless Chrome)
        timeout-minutes: 12
        run: |
          SANDBOX_ALLOW_FALLBACK=1 php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/oge.html && break
            sleep 1
          done
          node tools/browser-smoke.mjs http://127.0.0.1:8080
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- php server log ---"
            tail -50 /tmp/php-server.log || true
          fi
          kill $SERVER_PID 2>/dev/null || true
          exit $status

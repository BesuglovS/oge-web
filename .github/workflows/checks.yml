name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP lint
        run: php -l run_python.php && php -l git/index.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static site checks
        run: node tools/check-site.mjs

      - name: Service Worker cache bump
        run: |
          BASE=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$GITHUB_BASE_REF" && BASE="FETCH_HEAD"
          elif [ -n "$GITHUB_BEFORE" ] && ! echo "$GITHUB_BEFORE" | grep -qE '^0+$'; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BEFORE" && BASE="$GITHUB_BEFORE"
          fi
          if [ -n "$BASE" ]; then
            node tools/check-sw-version.mjs "$BASE"
          else
            echo "sw-version: база для diff недоступна, проверка пропущена"
          fi

      - name: JS lint (no-undef)
        run: |
          npm ci
          npm run lint:js

      - name: Progress sync regressions
        run: TZ=Europe/Samara node tools/check-progress-sync.mjs

      - name: CSS audit
        run: node tools/check-css.mjs

      - name: Data checks (tasks 1-16, including 13.1/13.2/14)
        run: node tools/check-data.mjs

      - name: Theory code examples
        run: node tools/check-theory.mjs

      - name: Task 11 answers vs archive
        run: node tools/check-oge11-archive.mjs

      - name: Sandbox integration test
        run: node tools/check-sandbox.mjs

      - name: Client resilience regressions (outbox, tracking, service worker)
        run: node tools/check-client-resilience.mjs

      # Браузерный smoke-тест: реальный Chrome, реальные страницы.
      # Сервер поднимаем в том же шаге — GitHub гасит фоновые процессы
      # при завершении шага. --csp проверяет страницы под строгой политикой
      # (script-src с хешами inline-скриптов, без 'unsafe-inline').
      - name: Browser smoke test (headless Chrome)
        timeout-minutes: 12
        run: |
          SANDBOX_ALLOW_FALLBACK=1 php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/oge.html && break
            sleep 1
          done
          node tools/browser-smoke.mjs http://127.0.0.1:8080 --csp
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- php server log ---"
            tail -50 /tmp/php-server.log || true
          fi
          # Гасим всё, что могло остаться: сервер и возможные процессы Chrome.
          kill -9 $SERVER_PID 2>/dev/null || true
          pkill -f 'chrome --headless' 2>/dev/null || true
          pkill -f 'chrome_crashpad' 2>/dev/null || true
          exit $status

      # Визуальная регрессия: вычисленные стили всех 38 страниц на двух ширинах
      # (desktop 1280, mobile 390) сравниваются с эталоном tools/visual-baseline.json.gz.
      # Метрики шрифта не сравниваются, поэтому эталон, снятый на Windows, сходится
      # с Linux-рендерингом; намеренные правки CSS — node tools/check-visual.mjs --update.
      - name: Visual regression (computed styles)
        timeout-minutes: 10
        run: |
          SANDBOX_ALLOW_FALLBACK=1 php -S 127.0.0.1:8080 -t . > /tmp/php-visual.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/oge.html && break
            sleep 1
          done
          node tools/check-visual.mjs
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- php server log ---"
            tail -30 /tmp/php-visual.log || true
          fi
          kill -9 $SERVER_PID 2>/dev/null || true
          pkill -f 'chrome --headless' 2>/dev/null || true
          pkill -f 'chrome_crashpad' 2>/dev/null || true
          exit $status

      # Снимок, на котором упала проверка: скачать и сравнить локально
      # (node tools/check-visual.mjs snap.json) — так отлаживать расхождения
      # можно без повторных прогонов CI.
      - name: Upload visual snapshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot
          path: /tmp/oge-visual-*.json
          if-no-files-found: ignore
          retention-days: 7

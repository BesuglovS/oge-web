          if (!args.length) throw new FormulaError('#ЗНАЧ!');
          const lists = args.map(flattenCells);
          const len = Math.min.apply(null, lists.map(function (l) { return l.length; }));
          let total = 0;
          for (let i = 0; i < len; i++) {
            let prod = 1;
            for (let j = 0; j < lists.length; j++) {
              const v = lists[j][i];
              prod *= v === null || v === undefined || v === '' ? 0 : toNumber(v);
            }
            total += prod;
          }
          return total;
        }
        if (name === 'ОКРУГЛ' || name === 'ROUND') {
          if (!args.length) throw new FormulaError('#ЗНАЧ!');
          const digits = args.length > 1 ? toNumber(args[1]) : 0;
          const factor = Math.pow(10, digits);
          const x = toNumber(args[0]) * factor;
          const rounded = x < 0 ? -Math.round(-x + 1e-9) : Math.round(x + 1e-9);
          return rounded / factor;
        }
        if (name === 'КОРЕНЬ' || name === 'SQRT') {
          const x = toNumber(args[0]);
          if (x < 0) throw new FormulaError('#ЧИСЛО!');
          return Math.sqrt(x);
        }
        throw new FormulaError('#ИМЯ?');
      }

      // Публичная точка входа движка (её использует и проверка ответа, и тесты).
      function evalFormula(src) {
        const text = String(src).replace(/^=/, '');
        const value = evalNode(parseFormula(text));
        if (isRange(value)) throw new FormulaError('#ЗНАЧ!');
        return value;
      }

      // Хук для тестов (browser-smoke): вычислить эталонную формулу задачи
      // на её собственном листе, не переключая текущую задачу.
      function evalTaskFormula(taskId) {
        const task = tasks.filter(function (t) { return t.id === taskId; })[0];
        if (!task) throw new FormulaError('#ССЫЛКА!');
        const sheet = sheets.filter(function (s) { return s.id === task.sheet; })[0];
        const savedRows = sheetRows;
        const savedHeaders = sheetHeaders;
        sheetRows = sheet.rows;
        sheetHeaders = sheet.headers;
        try {
          return evalFormula(task.formula);
        } finally {
          sheetRows = savedRows;
          sheetHeaders = savedHeaders;
        }
      }

      /* ── Отрисовка и проверка ответа ── */
      let currentTask = null;
      let lastTaskIndex = -1;
      let taskSaved = false;

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatNumber(v) {
        if (typeof v !== 'number' || !isFinite(v)) return String(v);
        const r = Math.round(v * 1e6) / 1e6;
        return String(r).replace('.', ',');
      }

      function renderSheet(sheet) {
        let html = '<div class="sheet-wrap"><table class="sheet-table"><caption class="sheet-caption">' + escapeHtml(sheet.title) + '</caption><thead><tr><th class="sheet-corner" aria-label="Угол таблицы"></th>';
        sheet.headers.forEach(function (h, i) {
          html += '<th scope="col">' + COL_LETTERS[i] + '</th>';
        });
        html += '</tr><tr><th class="sheet-corner"></th>';
        sheet.headers.forEach(function (h) {
          html += '<th scope="col" class="sheet-head">' + escapeHtml(h) + '</th>';
        });
        html += '</tr></thead><tbody>';
        sheet.rows.forEach(function (row, r) {
          html += '<tr><th scope="row" class="sheet-row-head">' + (r + 2) + '</th>';
          row.forEach(function (v) {
            const cls = typeof v === 'number' ? ' class="num"' : '';
            html += '<td' + cls + '>' + escapeHtml(formatNumber(v)) + '</td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
        return html;
      }

      function renderTask() {
        const task = currentTask;
        const sheet = sheets.filter(function (s) { return s.id === task.sheet; })[0];
        sheetHeaders = sheet.headers;
        sheetRows = sheet.rows;

        const card = document.getElementById('taskCard');
        card.innerHTML =
          '<div class="task-header"><span class="task-type table">' + escapeHtml(task.type) + '</span></div>' +
          '<div class="task-text">' + task.text + '</div>' +
          renderSheet(sheet) +
          '<div class="answer-section">' +
            '<label class="answer-label" for="answerInput">Ответ — число или формула:</label>' +
            '<input type="text" class="answer-input" id="answerInput" placeholder="Например: 42 или =СУММ(B2:B13)" autocomplete="off" spellcheck="false" autocapitalize="off" />' +
            '<div class="formula-preview" id="formulaPreview" aria-live="polite"></div>' +
            '<div class="buttons">' +
              '<button type="button" class="btn btn-check" data-act="checkAnswer" aria-label="Проверить ответ">✓ Проверить</button>' +
              '<button type="button" class="btn btn-next" data-act="nextTask" aria-label="Новая задача">🔄 Новая задача</button>' +
              '<button type="button" class="btn btn-hint" data-act="showHint" aria-label="Показать подсказку">💡 Подсказка</button>' +
              '<button type="button" class="btn btn-solution" data-act="showSolution" aria-label="Показать решение">📝 Решение</button>' +
            '</div>' +
            '<div class="result" id="result" role="status" aria-live="polite"></div>' +
          '</div>';

        const input = document.getElementById('answerInput');
        input.addEventListener('input', updatePreview);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
          }
        });
        input.focus();
      }

      function updatePreview() {
        const el = document.getElementById('formulaPreview');
        const input = document.getElementById('answerInput');
        if (!el || !input) return;
        const raw = input.value.trim();
        el.className = 'formula-preview';
        if (!raw || raw.charAt(0) !== '=') {
          el.textContent = '';
          return;
        }
        try {
          el.textContent = 'Значение формулы: ' + formatNumber(evalFormula(raw));
          el.className = 'formula-preview ok';
        } catch (e) {
          el.textContent = 'Ошибка в формуле: ' + (e && e.code ? e.code : 'проверьте запись');
          el.className = 'formula-preview error';
        }
      }

      function generateTask() {
        taskSaved = false;
        if (typeof trackTaskStart === 'function') { trackTaskStart('oge14'); }
        let idx = Math.floor(Math.random() * tasks.length);
        if (tasks.length > 1 && idx === lastTaskIndex) idx = (idx + 1) % tasks.length;
        lastTaskIndex = idx;
        currentTask = tasks[idx];
        renderTask();
      }

      function checkAnswer() {
        const input = document.getElementById('answerInput');
        const result = document.getElementById('result');
        const raw = input.value.trim();
        if (!raw) {
          input.focus();
          return;
        }

        let value;
        try {
          value = raw.charAt(0) === '='
            ? evalFormula(raw)
            : Number(raw.replace(/\s+/g, '').replace(',', '.'));
        } catch (e) {
          result.className = 'result incorrect';
          result.innerHTML = '⚠️ Формулу не удалось вычислить: <strong>' + escapeHtml(e && e.code ? e.code : 'проверьте запись') + '</strong>';
          return;
        }

        if (typeof value !== 'number' || !isFinite(value)) {
          result.className = 'result incorrect';
          result.innerHTML = '⚠️ Введите число или формулу, например <code>=СУММ(C2:C21)</code>.';
          return;
        }

        if (Math.abs(value - currentTask.answer) < 1e-6) {
          input.classList.remove('incorrect');
          input.classList.add('correct');
          result.className = 'result correct';
          if (!taskSaved) {
            taskSaved = true;
            if (typeof OGEProgress !== 'undefined') { OGEProgress.save('oge14', 1, 1); }
            if (typeof trackTaskComplete === 'function') { trackTaskComplete('oge14', 1); }
          }
          result.innerHTML = '✅ Правильно! Отличная работа!';
        } else {
          input.classList.remove('correct');
          input.classList.add('incorrect');
          result.className = 'result incorrect';
          result.innerHTML = '❌ Неправильно. Проверьте диапазон и условие формулы.';
        }
      }

      function nextTask() {
        hideHintsAndSolution();
        generateTask();
      }

      function hideHintsAndSolution() {
        document.getElementById('hintBox').style.display = 'none';
        document.getElementById('solutionBox').style.display = 'none';
      }

      function showHint() {
        if (typeof trackHint === 'function') { trackHint('oge14'); }
        const hintBox = document.getElementById('hintBox');
        const hintText = document.getElementById('hintText');
        hintText.innerHTML = currentTask.hint;
        hintBox.style.display = 'block';
      }

      function showSolution() {
        const solutionBox = document.getElementById('solutionBox');
        const solutionSteps = document.getElementById('solutionSteps');
        solutionSteps.innerHTML = currentTask.solution
          .map(function (step) { return '<div class="solution-step">' + step + '</div>'; })
          .join('');
        solutionBox.style.display = 'block';
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Инициализация
      generateTask();
      if (typeof OGEProgress !== 'undefined') { OGEProgress.renderProgressBar('progressContainer'); }
    </script>
    <script src="js/progress-client.js"></script>
    <script src="js/progress-sync.js"></script>
    <script src="js/tracking-client.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }
    </script>
  </body>

; Конфигурация opcache для PHP-FPM сайта oge.nayanovaacademy.ru.
;
; Почему это нужно: деплой атомарный, public — симлинк на releases/<ts>.
; По умолчанию opcache.revalidate_path=0, и opcache запоминает realpath
; файла: после переключения симлинка PHP-FPM продолжает выполнять
; предыдущий run_python.php / git/index.php (проверено на сервере —
; новый код песочницы не применялся до перезагрузки FPM).
;
; Установка (от root):
;   cp php-fpm-opcache.ini /etc/php/8.1/fpm/conf.d/99-oge-opcache.ini
;   php-fpm8.1 -t && systemctl reload php8.1-fpm.service
;
; Deploy-скрипт сверяет заголовок X-Sandbox-Build с локальным файлом
; и предупреждает, если PHP-FPM всё ещё выполняет старый код.

opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.revalidate_path=1

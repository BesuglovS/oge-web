<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7f5468">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <title>Нет соединения — Nayanova Academy</title>
  <style>
    :root {
      --na-bg-top: #241c18; --na-bg-mid: #3a2c26; --na-bg-bottom: #2b2119;
      --na-accent-1: #a56347; --na-accent-2: #7f5468;
      --na-text: #f5f5f7; --na-text-muted: rgba(255,255,255,.65);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--na-text);
      background: var(--na-bg-bottom);
      background-image: linear-gradient(135deg, var(--na-bg-top), var(--na-bg-mid), var(--na-bg-bottom));
      background-attachment: fixed;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .offline {
      max-width: 420px; text-align: center;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px; padding: 48px 32px; backdrop-filter: blur(10px);
    }
    .offline .icon { font-size: 56px; line-height: 1; }
    .offline h1 { font-size: 1.5rem; margin: 20px 0 8px; }
    .offline p { color: var(--na-text-muted); margin: 0 0 24px; line-height: 1.6; }
    .offline button {
      font: inherit; font-weight: 600; color: #fff; cursor: pointer;
      padding: 10px 20px; border: none; border-radius: 999px;
      background-image: linear-gradient(135deg, var(--na-accent-1), var(--na-accent-2));
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .offline button:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(165,99,71,.4); }
  </style>
</head>
<body>
  <main class="offline">
    <div class="icon" role="img" aria-label="Нет соединения">📡</div>
    <h1>Нет соединения с интернетом</h1>
    <p>Похоже, вы офлайн. Проверьте подключение и попробуйте снова — ранее открытые страницы доступны из кэша.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
    <p style="margin:16px 0 0"><a href="/" style="color:#fff;font-weight:600">← На главную</a></p>
  </main>
</body>
</html>

  <script>
      // Генераторы задач
      const taskGenerators = [
        // Тип 1: Подсчёт запусков с операцией mod
        {
          type: "count",
          generate: () => {
            const divisor = [5, 7, 9, 11, 12][Math.floor(Math.random() * 5)];
            const pairs = generatePairsForMod(divisor);
            const answer = countYesMod(pairs, divisor);

            return {
              taskType: "count",
              condition: "mod",
              divisor: divisor,
              pairs: pairs,
              answer: answer,
            };
          },
        },
        // Тип 2: Подсчёт запусков с логическим OR
        {
          type: "count",
          generate: () => {
            const threshold = Math.floor(Math.random() * 3) + 3; // 3-5
            const pairs = generatePairsForOr(threshold);
            const answer = countYesOr(pairs, threshold);

            return {
              taskType: "count",
              condition: "or",
              threshold: threshold,
              pairs: pairs,
              answer: answer,
            };
          },
        },
        // Тип 3: Подсчёт запусков с логическим AND
        {
          type: "count",
          generate: () => {
            const thresholdS = Math.floor(Math.random() * 5) + 5; // 5-9
            const thresholdT = Math.floor(Math.random() * 3) + 3; // 3-5
            const pairs = generatePairsForAnd(thresholdS, thresholdT);
            const answer = countYesAnd(pairs, thresholdS, thresholdT);

            return {
              taskType: "count",
              condition: "and",
              thresholdS: thresholdS,
              thresholdT: thresholdT,
              pairs: pairs,
              answer: answer,
            };
          },
        },
        // Тип 3b: Подсчёт запусков с NO (mod)
        {
          type: "count",
          generate: () => {
            const divisor = [5, 7, 9, 11, 12][Math.floor(Math.random() * 5)];
            const pairs = generatePairsForMod(divisor);
            const yesCount = countYesMod(pairs, divisor);
            const answer = 10 - yesCount; // NO = все - YES

            return {
              taskType: "count",
              condition: "mod",
              divisor: divisor,
              pairs: pairs,
              answer: answer,
              countType: "no", // подсчёт NO вместо YES
            };
          },
        },
        // Тип 3c: Подсчёт запусков с NO (or)
        {
          type: "count",
          generate: () => {
            const threshold = Math.floor(Math.random() * 3) + 3; // 3-5
            const pairs = generatePairsForOr(threshold);
            const yesCount = countYesOr(pairs, threshold);
            const answer = 10 - yesCount;

            return {
              taskType: "count",
              condition: "or",
              threshold: threshold,
              pairs: pairs,
              answer: answer,
              countType: "no",
            };
          },
        },
        // Тип 4: Определение параметра A (наименьшее)
        {
          type: "parameter",
          generate: () => {
            const targetYes = Math.floor(Math.random() * 3) + 4; // 4-6
            const pairs = generatePairsForParameter();
            const result = findParameterA(pairs, targetYes, "min");

            if (!result) return null;

            return {
              taskType: "parameter",
              pairs: pairs,
              targetYes: targetYes,
              answer: result.answer,
              findType: "min",
              condition: "and",
            };
          },
        },
        // Тип 5: Определение параметра A (наибольшее)
        {
          type: "parameter",
          generate: () => {
            const targetYes = Math.floor(Math.random() * 3) + 3; // 3-5
            const pairs = generatePairsForParameter2();
            const result = findParameterA2(pairs, targetYes, "max");

            if (!result) return null;

            return {
              taskType: "parameter",
              pairs: pairs,
              targetYes: targetYes,
              answer: result.answer,
              findType: "max",
              condition: "or",
            };
          },
        },
      ];

      // Вспомогательные функции

      function generatePairsForMod(divisor) {
        const pairs = [];
        const used = new Set();

        // Генерируем 10 пар. Примерно в половине пар t равен остатку от деления s
        // на divisor (гарантированный «YES»), в остальных t выбирается случайно.
        while (pairs.length < 10) {
          const s = Math.floor(Math.random() * 80) + 1;
          const remainder = s % divisor;
          const t =
            Math.random() < 0.5
              ? remainder
              : Math.floor(Math.random() * divisor);
          const key = `${s},${t}`;
          if (!used.has(key)) {
            used.add(key);
            pairs.push({ s, t });
          }
        }

        return pairs;
      }

      function countYesMod(pairs, divisor) {
        let count = 0;
        for (const pair of pairs) {
          if (pair.s % divisor === pair.t) {
            count++;
          }
        }
        return count;
      }

      function generatePairsForOr(threshold) {
        const pairs = [];
        const used = new Set();

        while (pairs.length < 10) {
          const s = Math.floor(Math.random() * 20) - 10; // -10 до 9
          const t = Math.floor(Math.random() * 20) - 10; // -10 до 9
          const key = `${s},${t}`;
          if (!used.has(key)) {
            used.add(key);
            pairs.push({ s, t });
          }
        }

        return pairs;
      }

      function countYesOr(pairs, threshold) {
        let count = 0;
        for (const pair of pairs) {
          if (Math.abs(pair.s) < threshold || Math.abs(pair.t) < threshold) {
            count++;
          }
        }
        return count;
      }

      function generatePairsForAnd(thresholdS, thresholdT) {
        const pairs = [];
        const used = new Set();

        while (pairs.length < 10) {
          const s = Math.floor(Math.random() * 20) - 5; // -5 до 14
          const t = Math.floor(Math.random() * 20) - 10; // -10 до 9
          const key = `${s},${t}`;
          if (!used.has(key)) {
            used.add(key);
            pairs.push({ s, t });
          }
        }

        return pairs;
      }

      function countYesAnd(pairs, thresholdS, thresholdT) {
        let count = 0;
        for (const pair of pairs) {
          if (pair.s > thresholdS && pair.t < thresholdT) {
            count++;
          }
        }
        return count;
      }

      function generatePairsForParameter() {
        // Генерируем пары для задачи с параметром A
        // Условие: (s >= A) and (t < 1)
        // Важно: все s среди пар с t < 1 должны быть уникальными,
        // иначе у границы A появятся «склеенные» значения s.
        const sPool = shuffleArray([
          -12, -8, -3, 1, 4, 7, 11, 15, 19, 24, 30, 37, 45, 55, 66, 80, 95, 110,
        ]);
        // 8 пар с t < 1 (s уникальны) + 2 пары, где t >= 1
        const pairs = sPool
          .slice(0, 8)
          .map((s) => ({ s, t: Math.floor(Math.random() * 41) - 40 }));

        while (pairs.length < 10) {
          const s = Math.floor(Math.random() * 121) - 10;
          const t = Math.floor(Math.random() * 50) + 1; // t >= 1
          if (pairs.some((p) => p.s === s && p.t === t)) continue;
          pairs.push({ s, t });
        }

        // Перемешиваем пары
        return shuffleArray(pairs);
      }

      function generatePairsForParameter2() {
        // Генерируем пары для задачи с параметром A
        // Условие: (s < A) or (t < A)
        // Важно: все min(s, t) должны быть уникальными для корректного решения
        const pairs = [];
        const usedMins = new Set();

        while (pairs.length < 10) {
          const s = Math.floor(Math.random() * 70) + 1;
          const t = Math.floor(Math.random() * 70) + 1;
          const minVal = Math.min(s, t);
          if (usedMins.has(minVal)) continue;
          usedMins.add(minVal);
          pairs.push({ s, t });
        }

        return shuffleArray(pairs);
      }

      function findParameterA(pairs, targetYes, findType) {
        // Условие: (s >= A) and (t < 1)
        // Сначала фильтруем пары, где t < 1
        const validPairs = pairs.filter((p) => p.t < 1);

        // Сортируем по s
        const sortedS = validPairs.map((p) => p.s).sort((a, b) => a - b);

        // Нам нужно ровно targetYes пар с s >= A, поэтому выбираем targetYes
        // наибольших значений s. Наименьшее подходящее A лежит в интервале
        // (sortedS[idx - 1]; sortedS[idx]], где idx = sortedS.length - targetYes.
        if (sortedS.length < targetYes) return null;
        if (targetYes === 0) return null;

        const idx = sortedS.length - targetYes;

        // idx = 0 означает, что условие должны выполнить ВСЕ пары с t < 1.
        // Тогда A можно брать сколь угодно малым — наименьшего значения нет.
        if (idx === 0) return null;

        // Граница должна быть строгой, иначе при совпадающих s решение
        // «перепрыгнет» лишнюю пару.
        if (sortedS[idx - 1] === sortedS[idx]) return null;

        // A должно быть > sortedS[idx - 1] и <= sortedS[idx]
        // Наименьшее целое A = sortedS[idx - 1] + 1
        return { answer: sortedS[idx - 1] + 1 };
      }

      function findParameterA2(pairs, targetYes, findType) {
        // Условие: (s < A) or (t < A)
        // Для каждой пары условие истинно, если min(s, t) < A

        const minValues = pairs.map((p) => Math.min(p.s, p.t));
        minValues.sort((a, b) => a - b);

        // Нам нужно ровно targetYes пар, где условие истинно (min(s, t) < A)
        // Для наибольшего A: A должно быть таким, чтобы ровно targetYes пар имели min < A
        // Это значит A = minValues[targetYes] (следующее значение после targetYes-го)
        // Тогда min < A будет верно ровно для targetYes пар (индексы 0..targetYes-1)

        if (targetYes >= minValues.length) return null;
        if (targetYes <= 0) return null;

        // При совпадающих min граница «склеит» пары и решение станет неверным.
        if (minValues[targetYes - 1] === minValues[targetYes]) return null;

        const answer = minValues[targetYes];

        return { answer };
      }

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      let currentTask = null;
      // Ставка сохраняется один раз на задачу, чтобы повторные «Проверить»
      // не накручивали attempts и события Метрики.
      let taskSaved = false;

      // Генерация задачи
      function generateTask() {
        taskSaved = false;
    if (typeof trackTaskStart === 'function') { trackTaskStart('oge6'); }
        let task = null;
        let attempts = 0;

        while (!task && attempts < 20) {
          const generator =
            taskGenerators[Math.floor(Math.random() * taskGenerators.length)];
          task = generator.generate();
          attempts++;
        }

        if (!task) {
          // Fallback задача
          task = {
            taskType: "count",
            condition: "mod",
            divisor: 7,
            pairs: [
              { s: 1, t: 1 },
              { s: 1, t: 2 },
              { s: 3, t: 2 },
              { s: 3, t: 3 },
              { s: 7, t: 0 },
              { s: 7, t: 2 },
              { s: 10, t: 0 },
              { s: 10, t: 7 },
              { s: 11, t: 4 },
              { s: 12, t: 5 },
            ],
            answer: 5,
          };
        }

        currentTask = task;
        renderTask();
        hideHintsAndSolution();
      }

      function renderTask() {
        const taskCard = document.getElementById("taskCard");

        let typeLabel = "";
        let typeClass = "";

        if (currentTask.taskType === "count") {
          typeLabel = "Подсчёт запусков";
          typeClass = "count";
        } else {
          typeLabel = "Определение параметра";
          typeClass = "parameter";
        }

        // Формируем текст задачи
        let taskHTML = "";

        if (currentTask.taskType === "count") {
          taskHTML = generateCountTaskHTML(currentTask);
        } else {
          taskHTML = generateParameterTaskHTML(currentTask);
        }

        taskCard.innerHTML = `
          <div class="task-header">
            <span class="task-type ${typeClass}">${typeLabel}</span>
          </div>
          <div class="task-text">${taskHTML}</div>
          <div class="answer-section">
            <label class="answer-label" for="answerInput">Ваш ответ:</label>
            <input type="text" class="answer-input" id="answerInput" placeholder="Введите ответ..." autocomplete="off" spellcheck="false" autocapitalize="off">
            <div class="buttons">
              <button type="button" class="btn btn-check" data-act="checkAnswer" aria-label="Проверить ответ">✓ Проверить</button>
              <button type="button" class="btn btn-next" data-act="nextTask" aria-label="Новая задача">🔄 Новая задача</button>
              <button type="button" class="btn btn-hint" data-act="showHint" aria-label="Показать подсказку">💡 Подсказка</button>
              <button type="button" class="btn btn-solution" data-act="showSolution" aria-label="Показать решение">📝 Решение</button>
            </div>
            <div class="result" id="result" role="status" aria-live="polite"></div>
          </div>
        `;

        document
          .getElementById("answerInput")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              checkAnswer();
            }
          });

        document.getElementById("answerInput").focus();

        // Инициализируем интерактивные кнопки пар чисел после рендеринга
        initPairButtons();
      }

      function generateCountTaskHTML(task) {
        let codeBlockPascal = "";
        let codeBlockPython = "";
        let conditionDesc = "";

        if (task.condition === "mod") {
          codeBlockPascal = `<pre><span class="keyword">var</span> s, t: <span class="keyword">integer</span>;
<span class="keyword">begin</span>
  readln(s);
  readln(t);
  <span class="keyword">if</span> s <span class="keyword">mod</span> <span class="number">${task.divisor}</span> = t <span class="keyword">then</span>
    writeln(<span class="string">'YES'</span>)
  <span class="keyword">else</span>
    writeln(<span class="string">'NO'</span>)
<span class="keyword">end</span>.</pre>`;
          codeBlockPython = `<pre>s = int(input())
t = int(input())
<span class="keyword">if</span> s % <span class="number">${task.divisor}</span> == t:
    print(<span class="string">'YES'</span>)
<span class="keyword">else</span>:
    print(<span class="string">'NO'</span>)</pre>`;
          conditionDesc = `Программа вычисляет остаток от деления s на ${task.divisor} и сравнивает его с t.`;
        } else if (task.condition === "or") {
          codeBlockPascal = `<pre><span class="keyword">var</span> s, t: <span class="keyword">integer</span>;
<span class="keyword">begin</span>
  readln(s);
  readln(t);
  <span class="keyword">if</span> (abs(s) < <span class="number">${task.threshold}</span>) <span class="keyword">or</span> (abs(t) < <span class="number">${task.threshold}</span>) <span class="keyword">then</span>
    writeln(<span class="string">'YES'</span>)
  <span class="keyword">else</span>
    writeln(<span class="string">'NO'</span>)
<span class="keyword">end</span>.</pre>`;
          codeBlockPython = `<pre>s = int(input())
t = int(input())
<span class="keyword">if</span> abs(s) < <span class="number">${task.threshold}</span> <span class="keyword">or</span> abs(t) < <span class="number">${task.threshold}</span>:
    print(<span class="string">'YES'</span>)
<span class="keyword">else</span>:
    print(<span class="string">'NO'</span>)</pre>`;
          conditionDesc = `Программа проверяет, меньше ли модуль s или модуль t числа ${task.threshold}.`;
        } else if (task.condition === "and") {
          codeBlockPascal = `<pre><span class="keyword">var</span> s, t: <span class="keyword">integer</span>;
<span class="keyword">begin</span>
  readln(s);
  readln(t);
  <span class="keyword">if</span> (s > <span class="number">${task.thresholdS}</span>) <span class="keyword">and</span> (t < <span class="number">${task.thresholdT}</span>) <span class="keyword">then</span>
    writeln(<span class="string">'YES'</span>)
  <span class="keyword">else</span>
    writeln(<span class="string">'NO'</span>)
<span class="keyword">end</span>.</pre>`;
          codeBlockPython = `<pre>s = int(input())
t = int(input())
<span class="keyword">if</span> s > <span class="number">${task.thresholdS}</span> <span class="keyword">and</span> t < <span class="number">${task.thresholdT}</span>:
    print(<span class="string">'YES'</span>)
<span class="keyword">else</span>:
    print(<span class="string">'NO'</span>)</pre>`;
          conditionDesc = `Программа проверяет, больше ли s числа ${task.thresholdS} И меньше ли t числа ${task.thresholdT}.`;
        }

        // Интерактивные кнопки для пар чисел
        const pairsHTML = task.pairs
          .map(
            (p, idx) =>
              `<button type="button" class="pair-btn" data-index="${idx}">(${p.s}, ${p.t})</button>`,
          )
          .join("");

        const countType = task.countType || "yes";
        const questionText =
          countType === "no"
            ? `Сколько было запусков, при которых программа напечатала <span class="highlight">«NO»</span>?`
            : `Сколько было запусков, при которых программа напечатала <span class="highlight">«YES»</span>?`;

        return `
          <p>Ниже приведена программа, записанная на языках Pascal и Python.</p>
          <div class="language-tabs">
            <button type="button" class="lang-tab active" data-act="switchLanguage" data-arg="pascal">Pascal</button>
            <button type="button" class="lang-tab" data-act="switchLanguage" data-arg="python">Python</button>
          </div>
          <div class="code-wrapper">
            <div class="code-block active" id="code-pascal">${codeBlockPascal}</div>
            <div class="code-block" id="code-python">${codeBlockPython}</div>
          </div>
          <p>${conditionDesc}</p>
          <p>Было проведено 10 запусков программы, при которых в качестве значений переменных s и t вводились следующие пары чисел:</p>
          <div class="pairs-box">
            <h4>Пары входных данных (s, t):</h4>
            <p class="pair-hint">💡 Нажмите на пару, чтобы отметить её как YES (зелёный) или NO (красный). Повторный клик переключает состояние.</p>
            <div class="pairs-container" id="pairsContainer">${pairsHTML}</div>
            <div class="pair-counter">
              <span>YES: <span class="count yes-count" id="yesCount">0</span></span>
              <span>NO: <span class="count no-count" id="noCount">0</span></span>
            </div>
          </div>
          <p>${questionText}</p>
        `;
      }

      function generateParameterTaskHTML(task) {
        let codeBlockPascal = "";
        let codeBlockPython = "";
        let conditionDesc = "";
        let question = "";

        if (task.condition === "and") {
          codeBlockPascal = `<pre><span class="keyword">var</span> s, t, A: <span class="keyword">integer</span>;
<span class="keyword">begin</span>
  readln(s);
  readln(t);
  readln(A);
  <span class="keyword">if</span> (s >= A) <span class="keyword">and</span> (t < <span class="number">1</span>) <span class="keyword">then</span>
    writeln(<span class="string">'YES'</span>)
  <span class="keyword">else</span>
    writeln(<span class="string">'NO'</span>)
<span class="keyword">end</span>.</pre>`;
          codeBlockPython = `<pre>s = int(input())
t = int(input())
A = int(input())
<span class="keyword">if</span> s >= A <span class="keyword">and</span> t < <span class="number">1</span>:
    print(<span class="string">'YES'</span>)
<span class="keyword">else</span>:
    print(<span class="string">'NO'</span>)</pre>`;
          conditionDesc = `Программа проверяет условие: s ≥ A И t < 1.`;
          question = `Укажите <span class="highlight">${
            task.findType === "min" ? "наименьшее" : "наибольшее"
          }</span> целое значение параметра A, при котором для указанных входных данных программа напечатает «YES» ровно <span class="highlight">${task.targetYes}</span> раз.`;
        } else if (task.condition === "or") {
          codeBlockPascal = `<pre><span class="keyword">var</span> s, t, A: <span class="keyword">integer</span>;
<span class="keyword">begin</span>
  readln(s);
  readln(t);
  readln(A);
  <span class="keyword">if</span> (s < A) <span class="keyword">or</span> (t < A) <span class="keyword">then</span>
    writeln(<span class="string">'YES'</span>)
  <span class="keyword">else</span>
    writeln(<span class="string">'NO'</span>)
<span class="keyword">end</span>.</pre>`;
          codeBlockPython = `<pre>s = int(input())
t = int(input())
A = int(input())
<span class="keyword">if</span> s < A <span class="keyword">or</span> t < A:
    print(<span class="string">'YES'</span>)
<span class="keyword">else</span>:
    print(<span class="string">'NO'</span>)</pre>`;
          conditionDesc = `Программа проверяет условие: s < A ИЛИ t < A.`;
          question = `Укажите <span class="highlight">${
            task.findType === "min" ? "наименьшее" : "наибольшее"
          }</span> целое значение параметра A, при котором для указанных входных данных программа напечатает «YES» ровно <span class="highlight">${task.targetYes}</span> раз.`;
        }

        const pairsHTML = task.pairs
          .map((p) => `<span class="pair-item">(${p.s}, ${p.t})</span>`)
          .join("");

        return `
          <p>Ниже приведена программа, записанная на языках Pascal и Python.</p>
          <div class="language-tabs">
            <button type="button" class="lang-tab active" data-act="switchLanguage" data-arg="pascal">Pascal</button>
            <button type="button" class="lang-tab" data-act="switchLanguage" data-arg="python">Python</button>
          </div>
          <div class="code-wrapper">
            <div class="code-block active" id="code-pascal">${codeBlockPascal}</div>
            <div class="code-block" id="code-python">${codeBlockPython}</div>
          </div>
          <p>${conditionDesc}</p>
          <p>Было проведено 10 запусков программы, при которых в качестве значений переменных s и t вводились следующие пары чисел:</p>
          <div class="pairs-box">
            <h4>Пары входных данных (s, t):</h4>
            <div class="pairs-list">${pairsHTML}</div>
          </div>
          <p>${question}</p>
        `;
      }

      function checkAnswer() {
        const input = document.getElementById("answerInput");
        const result = document.getElementById("result");
        const userAnswer = input.value.trim();

        if (!userAnswer) {
          input.focus();
          return;
        }

        const correctAnswer = currentTask.answer.toString();

        if (userAnswer === correctAnswer) {
          input.classList.remove("incorrect");
          input.classList.add("correct");
          result.className = "result correct"
          if (!taskSaved) {
            taskSaved = true;
            if (typeof OGEProgress !== 'undefined') { OGEProgress.save('oge6', 1, 1); }
            if (typeof trackTaskComplete === 'function') { trackTaskComplete('oge6', 1); }
          }
          result.innerHTML = `
            <span class="result-icon">🎉</span>
            ПРАВИЛЬНО! Отличная работа!
          `;
          result.style.display = "block";
          result.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          input.classList.remove("correct");
          input.classList.add("incorrect");
          result.className = "result incorrect";
          result.innerHTML = `
            <span class="result-icon">😔</span>
            НЕПРАВИЛЬНО!<br>
            <small>Правильный ответ: <strong>${correctAnswer}</strong></small>
          `;
          result.style.display = "block";
          result.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      function nextTask() {
        generateTask();
      }

      function showHint() {
    if (typeof trackHint === 'function') { trackHint('oge6'); }
        const hintBox = document.getElementById("hintBox");
        const hintText = document.getElementById("hintText");

        if (currentTask.taskType === "count") {
          const targetWord = currentTask.countType === "no" ? "«NO»" : "«YES»";
          const extraStep =
            currentTask.countType === "no"
              ? "<br>5. Либо найдите количество «YES» и вычтите его из 10 (всего было 10 запусков)."
              : "";
          if (currentTask.condition === "mod") {
            hintText.innerHTML = `
              <strong>Алгоритм решения:</strong><br><br>
              1. Для каждой пары (s, t) вычислите остаток от деления s на ${currentTask.divisor}.<br>
              2. Сравните полученный остаток с t.<br>
              3. Если они равны — программа выведет «YES», иначе — «NO».<br>
              4. Подсчитайте количество пар, для которых программа вывела ${targetWord}.${extraStep}
            `;
          } else if (currentTask.condition === "or") {
            hintText.innerHTML = `
              <strong>Алгоритм решения:</strong><br><br>
              1. Для каждой пары (s, t) вычислите |s| и |t|.<br>
              2. Проверьте: |s| < ${currentTask.threshold} ИЛИ |t| < ${currentTask.threshold}?<br>
              3. Если хотя бы одно условие истинно — программа выведет «YES», иначе — «NO».<br>
              4. Подсчитайте количество пар, для которых программа вывела ${targetWord}.${extraStep}
            `;
          } else if (currentTask.condition === "and") {
            hintText.innerHTML = `
              <strong>Алгоритм решения:</strong><br><br>
              1. Для каждой пары (s, t) проверьте оба условия:<br>
              &nbsp;&nbsp;&nbsp;• s > ${currentTask.thresholdS}?<br>
              &nbsp;&nbsp;&nbsp;• t < ${currentTask.thresholdT}?<br>
              2. Если ОБА условия истинны — программа выведет «YES», иначе — «NO».<br>
              3. Подсчитайте количество пар, для которых программа вывела ${targetWord}.${extraStep}
            `;
          }
        } else {
          if (currentTask.condition === "and") {
            hintText.innerHTML = `
              <strong>Алгоритм решения:</strong><br><br>
              1. Сначала отберите пары, где t < 1 (это обязательное условие).<br>
              2. Для каждой такой пары условие s ≥ A даёт ограничение: A ≤ s.<br>
              3. Найдите значение A, при котором ровно ${currentTask.targetYes} пар удовлетворяют условию.<br>
              4. ${
                currentTask.findType === "min"
                  ? "Выберите наименьшее подходящее значение."
                  : "Выберите наибольшее подходящее значение."
              }
            `;
          } else {
            hintText.innerHTML = `
              <strong>Алгоритм решения:</strong><br><br>
              1. Условие (s < A) или (t < A) истинно, если A больше хотя бы одного из чисел s или t.<br>
              2. Для каждой пары найдите min(s, t) — минимальное из двух чисел.<br>
              3. Условие истинно, если A > min(s, t).<br>
              4. Найдите значение A, при котором ровно ${currentTask.targetYes} пар удовлетворяют условию.
            `;
          }
        }

        hintBox.style.display = "block";
      }

      function showSolution() {
        const solutionBox = document.getElementById("solutionBox");
        const solutionSteps = document.getElementById("solutionSteps");

        let stepsHTML = "";

        if (currentTask.taskType === "count") {
          stepsHTML = generateCountSolution();
        } else {
          stepsHTML = generateParameterSolution();
        }

        solutionSteps.innerHTML = stepsHTML;
        solutionBox.style.display = "block";
      }

      function renderCountSummary(yesCount) {
        if (currentTask.countType === "no") {
          return `
            <div class="solution-step"><strong>Количество «YES»: ${yesCount}</strong></div>
            <div class="solution-step"><strong>Количество «NO»: 10 − ${yesCount} = ${10 - yesCount}</strong></div>
          `;
        }
        return `<div class="solution-step"><strong>Количество «YES»: ${yesCount}</strong></div>`;
      }

      function generateCountSolution() {
        let html = `<div class="solution-step"><strong>Составим таблицу трассировки:</strong></div>`;

        if (currentTask.condition === "mod") {
          html += `
            <table class="trace-table">
              <tr>
                <th>№</th>
                <th>s</th>
                <th>t</th>
                <th>s mod ${currentTask.divisor}</th>
                <th>Условие</th>
                <th>Вывод</th>
              </tr>
          `;

          let yesCount = 0;
          currentTask.pairs.forEach((pair, idx) => {
            const remainder = pair.s % currentTask.divisor;
            const isYes = remainder === pair.t;
            if (isYes) yesCount++;

            html += `
              <tr>
                <td>${idx + 1}</td>
                <td>${pair.s}</td>
                <td>${pair.t}</td>
                <td>${remainder}</td>
                <td>${remainder} ${isYes ? "=" : "≠"} ${pair.t}</td>
                <td class="${isYes ? "yes" : "no"}">${isYes ? "YES" : "NO"}</td>
              </tr>
            `;
          });

          html += `</table>`;
          html += renderCountSummary(yesCount);
        } else if (currentTask.condition === "or") {
          html += `
            <table class="trace-table">
              <tr>
                <th>№</th>
                <th>s</th>
                <th>t</th>
                <th>|s| < ${currentTask.threshold}?</th>
                <th>|t| < ${currentTask.threshold}?</th>
                <th>OR?</th>
                <th>Вывод</th>
              </tr>
          `;

          let yesCount = 0;
          currentTask.pairs.forEach((pair, idx) => {
            const condS = Math.abs(pair.s) < currentTask.threshold;
            const condT = Math.abs(pair.t) < currentTask.threshold;
            const isYes = condS || condT;
            if (isYes) yesCount++;

            html += `
              <tr>
                <td>${idx + 1}</td>
                <td>${pair.s}</td>
                <td>${pair.t}</td>
                <td>${condS ? "✓" : "✗"}</td>
                <td>${condT ? "✓" : "✗"}</td>
                <td>${isYes ? "✓" : "✗"}</td>
                <td class="${isYes ? "yes" : "no"}">${isYes ? "YES" : "NO"}</td>
              </tr>
            `;
          });

          html += `</table>`;
          html += renderCountSummary(yesCount);
        } else if (currentTask.condition === "and") {
          html += `
            <table class="trace-table">
              <tr>
                <th>№</th>
                <th>s</th>
                <th>t</th>
                <th>s > ${currentTask.thresholdS}?</th>
                <th>t < ${currentTask.thresholdT}?</th>
                <th>AND?</th>
                <th>Вывод</th>
              </tr>
          `;

          let yesCount = 0;
          currentTask.pairs.forEach((pair, idx) => {
            const condS = pair.s > currentTask.thresholdS;
            const condT = pair.t < currentTask.thresholdT;
            const isYes = condS && condT;
            if (isYes) yesCount++;

            html += `
              <tr>
                <td>${idx + 1}</td>
                <td>${pair.s}</td>
                <td>${pair.t}</td>
                <td>${condS ? "✓" : "✗"}</td>
                <td>${condT ? "✓" : "✗"}</td>
                <td>${isYes ? "✓" : "✗"}</td>
                <td class="${isYes ? "yes" : "no"}">${isYes ? "YES" : "NO"}</td>
              </tr>
            `;
          });

          html += `</table>`;
          html += renderCountSummary(yesCount);
        }

        html += `
          <div class="solution-step" style="background: #e8f5e9; border-left-color: #4caf50;">
            <strong>Ответ: ${currentTask.answer}</strong>
          </div>
        `;

        return html;
      }

      function generateParameterSolution() {
        let html = "";

        if (currentTask.condition === "and") {
          html = `
            <div class="solution-step">
              <strong>Условие: (s >= A) and (t < 1)</strong><br>
              Для вывода «YES» должны выполняться ОБА условия.
            </div>
            <div class="solution-step">
              <strong>Шаг 1:</strong> Отберём пары, где t < 1:
            </div>
            <table class="trace-table">
              <tr>
                <th>№</th>
                <th>s</th>
                <th>t</th>
                <th>t < 1?</th>
                <th>s >= A?</th>
              </tr>
          `;

          currentTask.pairs.forEach((pair, idx) => {
            const tCond = pair.t < 1;
            html += `
              <tr>
                <td>${idx + 1}</td>
                <td>${pair.s}</td>
                <td>${pair.t}</td>
                <td>${tCond ? "✓" : "✗"}</td>
                <td>${tCond ? `A ≤ ${pair.s}` : "—"}</td>
              </tr>
            `;
          });

          html += `</table>`;

          const validPairs = currentTask.pairs.filter((p) => p.t < 1);
          const sortedS = validPairs.map((p) => p.s).sort((a, b) => a - b);

          // Вычисляем границу для A
          const idx = sortedS.length - currentTask.targetYes;
          const prevS = idx > 0 ? sortedS[idx - 1] : null;
          const minSelectedS = sortedS[idx];

          html += `
            <div class="solution-step">
              <strong>Шаг 2:</strong> Пары с t < 1: ${validPairs.length}<br>
              Значения s (отсортированные): ${sortedS.join(", ")}
            </div>
            <div class="solution-step">
              <strong>Шаг 3:</strong> Нужно ровно ${currentTask.targetYes} «YES».<br>
              Для каждого YES нужно s ≥ A.<br>
              Выбираем ${currentTask.targetYes} наибольших значений s: ${sortedS.slice(-currentTask.targetYes).join(", ")}.<br>
              ${
                prevS !== null
                  ? `Чтобы ровно ${currentTask.targetYes} пар дали YES, A должно быть > ${prevS} (чтобы исключить пару с s = ${prevS}).<br>
                     Наименьшее целое A = ${prevS} + 1 = ${currentTask.answer}`
                  : `A может быть любым ≤ ${minSelectedS}. Наименьшее A = ${currentTask.answer}`
              }
            </div>
          `;
        } else if (currentTask.condition === "or") {
          html = `
            <div class="solution-step">
              <strong>Условие: (s < A) or (t < A)</strong><br>
              Для вывода «YES» достаточно выполнения ОДНОГО из условий.<br>
              Условие истинно, если min(s, t) < A.
            </div>
            <table class="trace-table">
              <tr>
                <th>№</th>
                <th>s</th>
                <th>t</th>
                <th>min(s, t)</th>
                <th>min < A?</th>
              </tr>
          `;

          currentTask.pairs.forEach((pair, idx) => {
            const minVal = Math.min(pair.s, pair.t);
            html += `
              <tr>
                <td>${idx + 1}</td>
                <td>${pair.s}</td>
                <td>${pair.t}</td>
                <td>${minVal}</td>
                <td>${minVal} < A</td>
              </tr>
            `;
          });

          html += `</table>`;

          const minValues = currentTask.pairs
            .map((p) => Math.min(p.s, p.t))
            .sort((a, b) => a - b);

          html += `
            <div class="solution-step">
              <strong>Шаг 2:</strong> min(s, t) для каждой пары (отсортированные):<br>
              ${minValues.join(", ")}
            </div>
            <div class="solution-step">
              <strong>Шаг 3:</strong> Нужно ровно ${currentTask.targetYes} «YES».<br>
              Условие min(s, t) < A истинно для пар, где min меньше A.<br>
              Для наибольшего A: A = ${minValues[currentTask.targetYes]} (следующее значение после ${currentTask.targetYes}-го минимального).<br>
              Тогда min < ${currentTask.answer} верно ровно для ${currentTask.targetYes} пар (с min = ${minValues.slice(0, currentTask.targetYes).join(", ")}).
            </div>
          `;
        }

        html += `
          <div class="solution-step" style="background: #e8f5e9; border-left-color: #4caf50;">
            <strong>Ответ: ${currentTask.answer}</strong>
          </div>
        `;

        return html;
      }

      function hideHintsAndSolution() {
        document.getElementById("hintBox").style.display = "none";
        document.getElementById("solutionBox").style.display = "none";
        document.getElementById("result").style.display = "none";
        const input = document.getElementById("answerInput");
        if (input) {
          input.classList.remove("correct", "incorrect");
          input.value = "";
        }
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Переключение языка программирования
      function switchLanguage(lang) {
        const pascalBlock = document.getElementById("code-pascal");
        const pythonBlock = document.getElementById("code-python");
        const tabs = document.querySelectorAll(".lang-tab");

        tabs.forEach((tab) => tab.classList.remove("active"));

        if (lang === "pascal") {
          pascalBlock.classList.add("active");
          pythonBlock.classList.remove("active");
          tabs[0].classList.add("active");
        } else {
          pythonBlock.classList.add("active");
          pascalBlock.classList.remove("active");
          tabs[1].classList.add("active");
        }
      }

      // Инициализация интерактивных кнопок пар чисел
      function initPairButtons() {
        const container = document.getElementById("pairsContainer");
        if (!container) return;

        const buttons = container.querySelectorAll(".pair-btn");
        const yesCountEl = document.getElementById("yesCount");
        const noCountEl = document.getElementById("noCount");

        buttons.forEach((btn) => {
          btn.addEventListener("click", function () {
            // Цикл переключения: нейтральный -> yes -> no -> нейтральный
            if (this.classList.contains("yes")) {
              this.classList.remove("yes");
              this.classList.add("no");
            } else if (this.classList.contains("no")) {
              this.classList.remove("no");
            } else {
              this.classList.add("yes");
            }

            // Обновляем счётчики
            updateCounters(container, yesCountEl, noCountEl);
          });
        });
      }

      function updateCounters(container, yesCountEl, noCountEl) {
        const yesButtons = container.querySelectorAll(".pair-btn.yes");
        const noButtons = container.querySelectorAll(".pair-btn.no");

        if (yesCountEl) yesCountEl.textContent = yesButtons.length;
        if (noCountEl) noCountEl.textContent = noButtons.length;
      }

      // Инициализация
      generateTask();
      if (typeof OGEProgress !== 'undefined') { OGEProgress.renderProgressBar('progressContainer'); }
    </script>

    <script src="js/progress-sync.js"></script>
    <script src="js/tracking-client.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }
    </script>
